<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PEHEN STUDIOS — Official PEHEN VERSE archive.">
<meta name="author" content="Pehen Studios">
<meta name="theme-color" content="#070b12">

<title>PEHEN STUDIOS | PEHEN VERSE</title>

<style>
/* =========================================================
   CORE
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#070b12;
    color:#f7f9fc;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

::selection{
    background:#f4c400;
    color:#070b12;
}

:root{
    --gold:#f4c400;
    --gold-light:#ffe56b;
    --blue:#008cff;
    --blue-light:#56c8ff;
    --bg:#070b12;
    --bg2:#0b111b;
    --card:#0d1520;
    --text:#f7f9fc;
    --muted:#8b98a9;
    --line:rgba(255,255,255,.09);
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-3;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(0,140,255,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 70%,
            rgba(244,196,0,.09),
            transparent 30%
        );
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;

    opacity:.25;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:55px 55px;
}


/* =========================================================
   NAVIGATION
========================================================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:72px;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7%;

    background:rgba(7,11,18,.92);

    border-bottom:1px solid rgba(0,140,255,.13);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.logo{
    color:white;
    text-decoration:none;

    font-size:19px;
    font-weight:1000;
    letter-spacing:3px;
}

.logo span{
    color:var(--gold);
}

.nav-list{
    display:flex;
    gap:25px;
    list-style:none;
}

.nav-list a{
    color:#8996a7;
    text-decoration:none;

    font-size:10px;
    font-weight:bold;
    letter-spacing:2px;

    transition:.2s;
}

.nav-list a:hover{
    color:var(--gold);
}

.menu-toggle{
    display:none;

    border:0;
    background:none;

    color:var(--gold);
    font-size:25px;
}


/* =========================================================
   COMMON
========================================================= */

section{
    padding:110px 7%;
}

.container{
    width:100%;
    max-width:1150px;
    margin:auto;
}

.section-head{
    text-align:center;
    max-width:800px;
    margin:0 auto 55px;
}

.kicker{
    color:var(--blue-light);

    font-size:10px;
    font-weight:bold;
    letter-spacing:5px;
}

.section-head h2{
    margin-top:12px;

    font-size:clamp(38px,6vw,68px);
    line-height:1;
    font-weight:1000;
}

.section-head h2 span{
    color:var(--gold);
}

.section-head p{
    margin-top:18px;

    color:var(--muted);

    line-height:1.8;
    font-size:14px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding-top:120px;

    text-align:center;
}

.hero-inner{
    max-width:1050px;
    margin:auto;
}

.hero-kicker{
    color:var(--gold);

    font-size:10px;
    font-weight:bold;
    letter-spacing:7px;

    margin-bottom:28px;
}

.hero h1{
    font-size:clamp(70px,15vw,170px);

    line-height:.8;
    letter-spacing:-7px;

    font-weight:1000;

    background:
        linear-gradient(
            100deg,
            #ffffff 5%,
            var(--blue-light) 35%,
            var(--gold) 60%,
            #ffffff 95%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:shine 7s ease-in-out infinite alternate;
}

.hero-title{
    margin-top:28px;

    color:var(--gold);

    font-size:clamp(30px,7vw,75px);

    font-weight:1000;
    letter-spacing:9px;
}

.hero-text{
    max-width:700px;

    margin:28px auto 0;

    color:#9ba7b7;

    font-size:16px;
    line-height:1.8;
}

.hero-actions{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;

    margin-top:35px;
}

.button{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-height:45px;

    padding:0 20px;

    border-radius:8px;

    border:1px solid var(--gold);

    background:rgba(244,196,0,.05);

    color:var(--gold);

    text-decoration:none;

    font-size:10px;
    font-weight:bold;
    letter-spacing:1.5px;

    transition:.25s;
}

.button:hover{
    background:var(--gold);
    color:#070b12;

    transform:translateY(-3px);
}

.button.blue{
    border-color:var(--blue);
    color:var(--blue-light);
}

.button.blue:hover{
    background:var(--blue);
    color:white;
}

@keyframes shine{
    from{
        background-position:0% 50%;
    }

    to{
        background-position:100% 50%;
    }
}


/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);

    border:1px solid var(--line);
    border-radius:18px;

    overflow:hidden;

    background:rgba(255,255,255,.015);
}

.stat{
    padding:30px 15px;

    text-align:center;

    border-right:1px solid var(--line);
}

.stat:last-child{
    border-right:0;
}

.stat-number{
    color:var(--gold);

    font-size:31px;
    font-weight:1000;
}

.stat-label{
    margin-top:7px;

    color:#6d7a8c;

    font-size:9px;
    letter-spacing:2px;
}


/* =========================================================
   VERSE
========================================================= */

.verse-grid{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:45px;

    align-items:center;
}

.verse-box{
    padding:40px;

    border:1px solid rgba(0,140,255,.2);
    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(0,140,255,.055),
            rgba(244,196,0,.025)
        );
}

.verse-box h3{
    color:var(--gold);

    font-size:28px;
    margin-bottom:18px;
}

.verse-box p{
    color:#9ca8b7;

    font-size:15px;
    line-height:1.9;
}

.verse-art{
    min-height:350px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
}

.outer-ring{
    width:270px;
    height:270px;

    border:1px solid var(--blue);

    border-radius:50%;

    box-shadow:
        0 0 70px rgba(0,140,255,.1);

    animation:rotate 18s linear infinite;
}

.outer-ring::before{
    content:"";

    position:absolute;

    width:175px;
    height:175px;

    margin:46px;

    border:2px solid var(--gold);

    border-radius:50%;
}

.center-mark{
    position:absolute;

    color:white;

    font-size:65px;
    font-weight:1000;

    text-shadow:
        0 0 30px rgba(0,140,255,.5);
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   CHARACTERS
========================================================= */

.tools{
    display:flex;
    flex-wrap:wrap;
    gap:10px;

    margin-bottom:30px;
}

.search{
    flex:1;
    min-width:240px;

    height:45px;

    padding:0 15px;

    border-radius:8px;

    outline:none;

    border:1px solid var(--line);

    background:#090f17;

    color:white;
}

.search:focus{
    border-color:var(--blue);
}

.search::placeholder{
    color:#667385;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.filter{
    height:45px;

    padding:0 14px;

    border-radius:8px;

    border:1px solid var(--line);

    background:#090f17;

    color:#7d8999;

    font-size:9px;
    font-weight:bold;
    letter-spacing:1px;
}

.filter:hover,
.filter.active{
    border-color:var(--gold);
    color:var(--gold);
}

.character-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(245px,1fr));

    gap:18px;
}

.character-card{
    position:relative;

    padding:27px;

    min-height:315px;

    border-radius:17px;

    border:1px solid var(--line);

    background:
        linear-gradient(
            145deg,
            rgba(0,140,255,.035),
            rgba(244,196,0,.018)
        );

    overflow:hidden;

    transition:.3s;
}

.character-card::after{
    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:2px;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--gold)
        );

    transform:scaleX(0);

    transform-origin:left;

    transition:.3s;
}

.character-card:hover{
    transform:translateY(-6px);

    border-color:rgba(0,140,255,.3);

    box-shadow:
        0 20px 50px rgba(0,80,180,.08);
}

.character-card:hover::after{
    transform:scaleX(1);
}

.character-card.hide{
    display:none;
}

.avatar{
    width:78px;
    height:78px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:23px;

    border-radius:50%;

    border:1px solid var(--gold);

    color:var(--gold);

    font-size:19px;
    font-weight:1000;

    background:rgba(244,196,0,.04);
}

.character-card h3{
    font-size:18px;
    font-weight:1000;
}

.role{
    margin-top:8px;

    color:var(--blue-light);

    font-size:9px;
    font-weight:bold;
    letter-spacing:2px;
}

.character-card p{
    margin-top:14px;

    color:#8996a7;

    font-size:13px;
    line-height:1.7;
}

.profile-button{
    margin-top:18px;

    padding:9px 13px;

    border-radius:6px;

    border:1px solid var(--line);

    background:transparent;

    color:#a1adbc;

    font-size:9px;
    font-weight:bold;
    letter-spacing:1px;
}

.profile-button:hover{
    color:var(--gold);
    border-color:var(--gold);
}


/* =========================================================
   PROJECTS
========================================================= */

.project-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));

    gap:18px;
}

.project{
    position:relative;

    min-height:270px;

    padding:32px;

    overflow:hidden;

    border:1px solid var(--line);
    border-radius:18px;

    background:#0a1018;

    transition:.3s;
}

.project:hover{
    transform:translateY(-5px);

    border-color:rgba(244,196,0,.3);
}

.project-number{
    position:absolute;

    top:0;
    right:17px;

    color:rgba(255,255,255,.035);

    font-size:90px;
    font-weight:1000;
}

.project h3{
    position:relative;

    color:var(--gold);

    font-size:26px;

    margin-bottom:15px;
}

.project p{
    position:relative;

    color:#8d99a9;

    font-size:14px;

    line-height:1.8;
}


/* =========================================================
   LORE
========================================================= */

.lore-list{
    max-width:950px;
    margin:auto;
}

.lore-item{
    display:grid;
    grid-template-columns:100px 1fr;

    gap:20px;

    margin-bottom:20px;
}

.lore-date{
    padding-top:20px;

    color:var(--gold);

    font-size:9px;
    font-weight:bold;
    letter-spacing:2px;
}

.lore-content{
    padding:22px 25px;

    border-left:2px solid var(--blue);

    border-radius:
        0 12px 12px 0;

    background:rgba(0,140,255,.025);
}

.lore-content h3{
    margin-bottom:9px;
}

.lore-content p{
    color:#8996a7;

    font-size:13px;
    line-height:1.8;
}


/* =========================================================
   ARCHIVES
========================================================= */

.archive-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(240px,1fr));

    gap:18px;
}

.archive{
    padding:29px;

    border:1px solid var(--line);
    border-radius:17px;

    background:#0a1018;

    transition:.25s;
}

.archive:hover{
    transform:translateY(-5px);

    border-color:var(--blue);
}

.archive-icon{
    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:17px;

    border-radius:11px;

    border:1px solid rgba(244,196,0,.2);

    color:var(--gold);

    font-size:19px;
}

.archive h3{
    font-size:17px;
    margin-bottom:9px;
}

.archive p{
    color:#8794a5;

    font-size:13px;
    line-height:1.7;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;

    z-index:5000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.88);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.modal.open{
    display:flex;
}

.modal-box{
    position:relative;

    width:100%;
    max-width:680px;

    max-height:90vh;
    overflow:auto;

    padding:38px;

    border:1px solid var(--blue);

    border-radius:20px;

    background:#080e17;

    box-shadow:
        0 0 80px rgba(0,140,255,.12);

    animation:modalIn .2s ease;
}

.modal-close{
    position:absolute;

    top:13px;
    right:13px;

    width:40px;
    height:40px;

    border-radius:50%;

    border:1px solid rgba(244,196,0,.2);

    background:rgba(244,196,0,.04);

    color:var(--gold);

    font-size:24px;
}

.modal-symbol{
    width:95px;
    height:95px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:22px;

    border-radius:50%;

    border:2px solid var(--gold);

    color:var(--gold);

    font-size:25px;
    font-weight:1000;
}

.modal-box h2{
    padding-right:45px;

    color:var(--gold);

    font-size:30px;
}

.modal-role{
    margin-top:8px;

    color:var(--blue-light);

    font-size:9px;
    font-weight:bold;
    letter-spacing:3px;
}

.modal-description{
    margin-top:20px;

    color:#a5b0bd;

    font-size:15px;
    line-height:1.9;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


/* =========================================================
   SECRET
========================================================= */

.secret-trigger{
    position:fixed;

    right:18px;
    bottom:18px;

    z-index:900;

    width:43px;
    height:43px;

    border-radius:50%;

    border:1px solid rgba(0,140,255,.25);

    background:#09121d;

    color:var(--blue);

    opacity:.45;

    transition:.2s;
}

.secret-trigger:hover{
    opacity:1;

    box-shadow:
        0 0 25px rgba(0,140,255,.2);
}

.secret{
    position:fixed;
    inset:0;

    z-index:6000;

    display:none;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;

    background:rgba(0,0,0,.95);
}

.secret.open{
    display:flex;
}

.secret-inner{
    max-width:850px;
}

.secret-inner h2{
    color:var(--gold);

    font-size:clamp(55px,12vw,120px);

    font-weight:1000;
}

.roar{
    margin-top:20px;

    color:white;

    font-size:clamp(20px,4vw,34px);

    font-weight:bold;
    line-height:1.8;
}

.secret-sub{
    margin-top:10px;

    color:#647184;

    font-size:9px;
    letter-spacing:4px;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    padding:75px 7% 30px;

    text-align:center;

    border-top:1px solid var(--line);
}

.footer-logo{
    font-size:30px;

    font-weight:1000;
    letter-spacing:3px;
}

.footer-logo span{
    color:var(--gold);
}

.footer-text{
    margin-top:10px;

    color:#6f7c8d;

    font-size:13px;
}

.credit{
    margin-top:28px;
    padding-top:23px;

    border-top:1px solid var(--line);

    color:#8794a5;

    font-size:13px;
}

.credit strong{
    color:var(--gold);
}

.copyright{
    margin-top:12px;

    color:#566273;

    font-size:10px;
    letter-spacing:2px;
}

.version{
    margin-top:17px;

    color:var(--blue-light);

    font-size:9px;
    letter-spacing:3px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .navbar{
        padding:0 5%;
    }

    .menu-toggle{
        display:block;
    }

    .nav-list{
        position:absolute;

        top:72px;
        left:0;

        width:100%;

        display:block;

        max-height:0;
        overflow:hidden;

        background:#070b12;

        border-bottom:1px solid rgba(0,140,255,.12);

        transition:max-height .25s ease;
    }

    .nav-list.open{
        max-height:450px;
    }

    .nav-list li{
        padding:14px;

        text-align:center;
    }

    .verse-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat:nth-child(2){
        border-right:0;
    }

    .stat:nth-child(-n+2){
        border-bottom:1px solid var(--line);
    }

}

@media(max-width:520px){

    section{
        padding:85px 5%;
    }

    .hero h1{
        letter-spacing:-4px;
    }

    .hero-title{
        letter-spacing:4px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .stat{
        border-right:0;
        border-bottom:1px solid var(--line);
    }

    .stat:last-child{
        border-bottom:0;
    }

    .verse-box{
        padding:27px;
    }

    .lore-item{
        grid-template-columns:1fr;
        gap:5px;
    }

    .lore-date{
        padding-top:0;
    }

    .modal-box{
        padding:27px;
    }

}

</style>
</head>

<body>


<!-- =========================================================
     NAVIGATION
========================================================= -->

<nav class="navbar">

    <a class="logo" href="#home">
        PEHEN <span>STUDIOS</span>
    </a>

    <button
        class="menu-toggle"

    >

    </button>

    <ul class="nav-list" id="navList">

        <li><a href="#home">HOME</a></li>
        <li><a href="#verse">VERSE</a></li>
        <li><a href="#characters">CHARACTERS</a></li>
        <li><a href="#projects">PROJECTS</a></li>
        <li><a href="#lore">LORE</a></li>
        <li><a href="#archives">ARCHIVES</a></li>

    </ul>

</nav>


<!-- =========================================================
     HERO
========================================================= -->

<section class="hero" id="home">

    <div class="hero-inner">

        <div class="hero-kicker">
            OFFICIAL PEHEN STUDIOS WEBSITE
        </div>

        <h1>
            PEHEN
        </h1>

        <div class="hero-title">
            VERSE
        </div>

        <p class="hero-text">
            Welcome to the official archive of the Pehen-Verse —
            a growing fictional universe filled with characters,
            stories, mysteries, timelines and worlds.
        </p>

        <div class="hero-actions">

            <a
                class="button"
                href="#characters"
            >
                EXPLORE CHARACTERS
            </a>

            <a
                class="button blue"
