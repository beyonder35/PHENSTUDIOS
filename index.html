<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PEHEN STUDIOS — Official home of the PEHEN VERSE.">
<meta name="author" content="Pehen Studios">
<meta name="theme-color" content="#03050a">

<title>PEHEN STUDIOS | PEHEN VERSE</title>

<style>

/* =====================================================
   ROOT
===================================================== */

:root{
    --yellow:#ffd000;
    --yellow-light:#ffe66d;
    --blue:#009dff;
    --blue-light:#55c8ff;
    --black:#03050a;
    --dark:#070b12;
    --card:#0a1019;
    --text:#ffffff;
    --muted:#8b98a9;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--black);
    color:var(--text);
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    border:none;
}

::selection{
    background:var(--yellow);
    color:#000;
}


/* =====================================================
   LOADER
===================================================== */

#loader{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#020407;

    transition:
        opacity .45s ease,
        visibility .45s ease;
}

#loader.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loader-content{
    width:min(90%,500px);
    text-align:center;
}

.loader-logo{
    font-size:clamp(35px,8vw,75px);
    font-weight:900;
    letter-spacing:5px;
}

.loader-logo span{
    color:var(--yellow);
}

.loader-line{
    width:100%;
    height:3px;
    margin:25px 0;
    overflow:hidden;
    background:#151b24;
}

.loader-progress{
    width:100%;
    height:100%;
    background:linear-gradient(
        90deg,
        var(--blue),
        var(--yellow)
    );
    animation:loaderProgress 1s ease;
}

.loader-text{
    color:#687486;
    font-size:11px;
    letter-spacing:4px;
}

@keyframes loaderProgress{
    from{
        transform:translateX(-100%);
    }
    to{
        transform:translateX(0);
    }
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-3;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(0,157,255,.16),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 70%,
            rgba(255,208,0,.1),
            transparent 30%
        );
}

.grid{
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;

    background-image:
        linear-gradient(
            rgba(0,157,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,157,255,.025) 1px,
            transparent 1px
        );

    background-size:50px 50px;
}


/* =====================================================
   NAV
===================================================== */

nav{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:72px;

    padding:0 7%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(3,5,10,.82);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(0,157,255,.14);

    z-index:5000;
}

.logo{
    font-size:20px;
    font-weight:900;
    letter-spacing:3px;
}

.logo span{
    color:var(--yellow);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:25px;
    list-style:none;
}

.nav-links button{
    background:transparent;
    color:#9ba7b7;

    cursor:pointer;

    font-size:13px;
    font-weight:bold;
    letter-spacing:1.5px;

    transition:.25s;
}

.nav-links button:hover{
    color:var(--yellow);
}

.menu{
    display:none;

    background:transparent;
    color:var(--yellow);

    font-size:28px;

    cursor:pointer;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:120px 20px 80px;

    text-align:center;
}

.hero-content{
    width:100%;
    max-width:1100px;
}

.hero-tag{
    color:var(--yellow);

    font-size:11px;
    font-weight:bold;

    letter-spacing:6px;

    margin-bottom:25px;
}

.hero h1{
    font-size:clamp(60px,13vw,160px);

    line-height:.8;

    font-weight:1000;

    letter-spacing:-6px;

    background:
        linear-gradient(
            110deg,
            #fff,
            var(--blue-light),
            var(--yellow),
            #fff
        );

    background-size:300%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:gradientMove 5s infinite alternate;
}

.hero h2{
    margin-top:25px;

    color:var(--yellow);

    font-size:clamp(28px,6vw,65px);

    letter-spacing:8px;

    text-shadow:
        0 0 30px rgba(255,208,0,.25);
}

.hero p{
    max-width:700px;

    margin:30px auto;

    color:#9ca8b8;

    font-size:18px;

    line-height:1.7;
}

.hero-buttons{
    display:flex;
    justify-content:center;

    gap:12px;

    flex-wrap:wrap;

    margin-top:35px;
}

.btn{
    padding:14px 24px;

    border-radius:7px;

    border:1px solid var(--yellow);

    background:rgba(255,208,0,.04);

    color:var(--yellow);

    cursor:pointer;

    font-weight:bold;

    letter-spacing:1px;

    transition:.25s;
}

.btn:hover{
    background:var(--yellow);
    color:#000;

    transform:translateY(-3px);

    box-shadow:
        0 0 30px rgba(255,208,0,.25);
}

.btn.blue{
    color:var(--blue-light);
    border-color:var(--blue);
}

.btn.blue:hover{
    background:var(--blue);
    color:white;
}


/* =====================================================
   SECTIONS
===================================================== */

section{
    padding:100px 7%;
    position:relative;
}

.section-title{
    text-align:center;
    margin-bottom:50px;
}

.section-tag{
    color:var(--blue-light);

    font-size:10px;
    font-weight:bold;

    letter-spacing:4px;
}

.section-title h2{
    margin-top:10px;

    font-size:clamp(30px,5vw,58px);
    font-weight:900;
}

.section-title h2 span{
    color:var(--yellow);
}


/* =====================================================
   STATS
===================================================== */

.stats{
    max-width:1000px;

    margin:0 auto;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;

    overflow:hidden;
}

.stat{
    padding:28px;
    text-align:center;

    border-right:1px solid rgba(255,255,255,.07);
}

.stat:last-child{
    border-right:none;
}

.stat strong{
    display:block;

    color:var(--yellow);

    font-size:30px;
    font-weight:900;
}

.stat span{
    color:#707c8c;

    font-size:11px;
    letter-spacing:2px;
}


/* =====================================================
   VERSE
===================================================== */

.verse{
    max-width:1150px;
    margin:auto;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:50px;

    align-items:center;
}

.verse-box{
    padding:40px;

    border-radius:18px;

    border:1px solid rgba(0,157,255,.2);

    background:
        linear-gradient(
            145deg,
            rgba(0,157,255,.07),
            rgba(255,208,0,.025)
        );
}

.verse-box h3{
    margin-bottom:20px;

    color:var(--yellow);

    font-size:26px;
}

.verse-box p{
    color:#aab5c3;

    line-height:1.8;

    font-size:17px;
}

.verse-symbol{
    height:350px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
}

.ring{
    width:260px;
    height:260px;

    border:1px solid var(--blue);

    border-radius:50%;

    box-shadow:
        0 0 50px rgba(0,157,255,.15);

    animation:spin 18s linear infinite;
}

.ring::after{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    margin:44px;

    border:2px solid var(--yellow);

    border-radius:50%;
}

.ring-text{
    position:absolute;

    font-size:50px;
    font-weight:900;

    color:white;

    text-shadow:
        0 0 25px var(--blue);
}


/* =====================================================
   DATABASE
===================================================== */

.database-tools{
    max-width:1100px;

    margin:0 auto 35px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;
}

.search-box{
    flex:1;
    min-width:240px;
}

.search-box input{
    width:100%;

    padding:14px 17px;

    border-radius:8px;

    border:1px solid rgba(0,157,255,.2);

    background:#080d14;

    color:white;

    outline:none;

    font-size:16px;
}

.search-box input:focus{
    border-color:var(--blue);

    box-shadow:
        0 0 20px rgba(0,157,255,.1);
}

.filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.filter{
    padding:11px 15px;

    border-radius:7px;

    border:1px solid rgba(255,255,255,.1);

    background:#080d14;

    color:#8e9aaa;

    cursor:pointer;

    font-weight:bold;

    transition:.2s;
}

.filter:hover,
.filter.active{
    color:var(--yellow);
    border-color:var(--yellow);
}


/* =====================================================
   CHARACTERS
===================================================== */

.characters{
    max-width:1200px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(245px,1fr));

    gap:20px;
}

.character{
    min-height:330px;

    overflow:hidden;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.08);

    background:#080d14;

    cursor:pointer;

    transition:.3s;
}

.character:hover{
    transform:translateY(-8px);

    border-color:var(--blue);

    box-shadow:
        0 20px 50px rgba(0,120,255,.12);
}

.character.hidden{
    display:none;
}

.character-image{
    height:190px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(0,157,255,.25),
            transparent 45%
        ),
        #07101a;

    overflow:hidden;
}

.character-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:.4s;
}

.character:hover .character-image img{
    transform:scale(1.06);
}

.placeholder-avatar{
    width:95px;
    height:95px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:2px solid var(--yellow);

    color:var(--yellow);

    font-size:25px;
    font-weight:900;

    box-shadow:
        0 0 35px rgba(255,208,0,.2);
}

.character-info{
    padding:20px;
}

.character-info h3{
    font-size:17px;
    font-weight:900;
}

.character-role{
    margin:7px 0;

    color:var(--blue-light);

    font-size:11px;
    letter-spacing:2px;
}

.character-info p{
    color:#8793a3;

    font-size:14px;

    line-height:1.5;
}


/* =====================================================
   PROJECTS
===================================================== */

.projects{
    max-width:1150px;
    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));

    gap:22px;
}

.project{
    position:relative;

    min-height:270px;

    padding:32px;

    overflow:hidden;

    border-radius:17px;

    border:1px solid rgba(255,208,0,.12);

    background:
        linear-gradient(
            145deg,
            rgba(255,208,0,.05),
            rgba(0,157,255,.04)
        );

    transition:.3s;
}

.project:hover{
    transform:translateY(-6px);

    border-color:var(--yellow);
}

.project-number{
    position:absolute;

    top:5px;
    right:20px;

    font-size:70px;
    font-weight:900;

    color:rgba(255,255,255,.035);
}

.project h3{
    color:var(--yellow);

    font-size:26px;

    margin-bottom:15px;
}

.project p{
    color:#929eae;

    line-height:1.7;
}


/* =====================================================
   LORE
===================================================== */

.lore-list{
    max-width:950px;
    margin:auto;
}

.lore-item{
    display:grid;

    grid-template-columns:110px 1fr;

    gap:20px;

    margin-bottom:22px;
}

.lore-date{
    padding-top:18px;

    color:var(--yellow);

    font-size:11px;
    font-weight:bold;
    letter-spacing:2px;
}

.lore-content{
    padding:20px 25px;

    border-left:2px solid var(--blue);

    background:rgba(0,157,255,.035);

    border-radius:
        0 12px 12px 0;
}

.lore-content h3{
    margin-bottom:8px;
}

.lore-content p{
    color:#8995a5;

    line-height:1.65;
}


/* =====================================================
   ARCHIVES
===================================================== */

.archive-grid{
    max-width:1150px;
    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(270px,1fr));

    gap:20px;
}

.archive-card{
    padding:30px;

    border-radius:16px;

    border:1px solid rgba(0,157,255,.14);

    background:rgba(0,157,255,.025);

    transition:.3s;
}

.archive-card:hover{
    transform:translateY(-5px);

    border-color:var(--blue);
}

.archive-icon{
    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:18px;

    border-radius:11px;

    border:1px solid rgba(255,208,0,.2);

    color:var(--yellow);

    font-size:21px;
}

.archive-card h3{
    margin-bottom:10px;
}

.archive-card p{
    color:#8995a5;

    line-height:1.65;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.84);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    z-index:10000;
}

.modal.active{
    display:flex;
}

.modal-box{
    position:relative;

    width:100%;
    max-width:720px;

    max-height:90vh;

    overflow:auto;

    padding:35px;

    border-radius:20px;

    border:1px solid var(--blue);

    background:#070d15;

    box-shadow:
        0 0 70px rgba(0,157,255,.15);

    animation:modalIn .25s ease;
}

.modal-close{
    position:absolute;

    top:15px;
    right:15px;

    width:40px;
    height:40px;

    border-radius:50%;

    background:rgba(255,208,0,.06);

    color:var(--yellow);

    font-size:27px;

    cursor:pointer;

    z-index:5;
}

.modal-close:hover{
    background:rgba(255,208,0,.15);
}

.modal-image{
    height:220px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin-bottom:22px;

    overflow:hidden;

    border-radius:14px;

    background:#050a11;
}

.modal-image img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.modal-box h2{
    padding-right:45px;

    color:var(--yellow);

    font-size:28px;
}

.modal-role{
    margin:7px 0 18px;

    color:var(--blue-light);

    font-size:11px;

    letter-spacing:3px;
}

.modal-box p{
    color:#aab5c3;

    font-size:17px;

    line-height:1.8;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    padding:70px 7% 30px;

    text-align:center;

    border-top:1px solid rgba(255,255,255,.07);
}

.footer-logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:3px;
}

.footer-logo span{
    color:var(--yellow);
}

.footer-description{
    margin-top:10px;

    color:#687486;
}

.footer-credit{
    margin-top:28px;
    padding-top:23px;

    border-top:1px solid rgba(255,255,255,.06);

    color:#8995a5;
}

.footer-credit strong{
    color:var(--yellow);
}

.copyright{
    margin-top:10px;

    color:#566171;

    font-size:11px;

    letter-spacing:2px;
}

.footer-version{
    margin-top:17px;

    color:var(--blue-light);

    font-size:10px;

    letter-spacing:3px;
}


/* =====================================================
   EASTER EGG
===================================================== */

.easter{
    position:fixed;

    right:18px;
    bottom:18px;

    width:44px;
    height:44px;

    border-radius:50%;

    background:rgba(0,157,255,.08);

    border:1px solid rgba(0,157,255,.25);

    color:var(--blue);

    cursor:pointer;

    opacity:.45;

    z-index:3000;
}

.easter:hover{
    opacity:1;
}


/* =====================================================
   SECRET
===================================================== */

.secret-message{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;

    background:rgba(0,0,0,.94);

    z-index:20000;
}

.secret-message.active{
    display:flex;
}

.secret-message h2{
    color:var(--yellow);

    font-size:clamp(40px,9vw,90px);
}

.secret-message p{
    margin-top:15px;

    color:#8995a5;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes gradientMove{
    from{
        background-position:0%;
    }
    to{
        background-position:100%;
    }
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.95);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

    nav{
        padding:0 5%;
    }

    .menu{
        display:block;
    }

    .nav-links{
        position:absolute;

        top:72px;
        left:0;

        width:100%;

        display:flex;
        flex-direction:column;

        gap:0;

        max-height:0;

        overflow:hidden;

        background:rgba(3,5,10,.98);

        transition:max-height .35s ease;
    }

    .nav-links.open{
        max-height:500px;
    }

    .nav-links li{
        padding:16px;
    }

    .verse{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat{
        border-bottom:1px solid rgba(255,255,255,.07);
    }

}

@media(max-width:550px){

    .stats{
        grid-template-columns:1fr;
    }

    .stat{
        border-right:none;
    }

    .hero h1{
        letter-spacing:-3px;
    }

    .hero h2{
        letter-spacing:4px;
    }

    section{
        padding:80px 5%;
    }

    .modal-box{
        padding:25px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     LOADER
===================================================== -->

<div id="loader">

    <div class="loader-content">

        <div class="loader-logo">
            PEHEN <span>STUDIOS</span>
        </div>

        <div class="loader-line">
            <div class="loader-progress"></div>
        </div>

        <div class="loader-text">
            INITIALIZING PEHEN VERSE
        </div>

    </div>

</div>


<div class="grid"></div>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav>

    <div class="logo">
        PEHEN <span>STUDIOS</span>
    </div>

    <ul class="nav-links" id="navLinks">

        <li>
            <button type="button" data-scroll="home">
                HOME
            </button>
        </li>

        <li>
            <button type="button" data-scroll="verse">
                VERSE
            </button>
        </li>

        <li>
            <button type="button" data-scroll="characters">
