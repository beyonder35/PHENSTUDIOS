<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="PEHEN STUDIOS — The official home of the PEHEN VERSE.">
<meta name="author" content="Pehen Studios">
<meta name="theme-color" content="#05070c">

<title>PEHEN STUDIOS — PEHEN VERSE</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#05070c;
    color:#ffffff;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

::selection{
    background:#ffd000;
    color:#05070c;
}


/* =========================================================
   VARIABLES
========================================================= */

:root{
    --yellow:#ffd000;
    --yellow2:#ffea72;

    --blue:#009dff;
    --blue2:#52c7ff;

    --black:#05070c;
    --dark:#080d15;
    --card:#0b111b;

    --white:#ffffff;
    --muted:#8995a6;

    --border:rgba(255,255,255,.08);
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(0,157,255,.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(255,208,0,.10),
            transparent 30%
        ),
        #05070c;
}

.grid{
    position:fixed;
    inset:0;
    z-index:-9;
    pointer-events:none;

    opacity:.4;

    background-image:
        linear-gradient(
            rgba(0,157,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,157,255,.025) 1px,
            transparent 1px
        );

    background-size:50px 50px;
}


/* =========================================================
   LOADER
========================================================= */

#loader{
    position:fixed;
    inset:0;

    z-index:999999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#03050a;

    animation:
        hideLoader .55s ease 2.2s forwards;
}

.loader-inner{
    width:min(88%,520px);
    text-align:center;
}

.loader-logo{
    font-size:clamp(35px,8vw,75px);
    font-weight:1000;
    letter-spacing:5px;
}

.loader-logo span{
    color:var(--yellow);
}

.loader-line{
    width:100%;
    height:3px;

    margin:28px 0 18px;

    overflow:hidden;

    background:#151c27;
}

.loader-progress{
    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--yellow)
        );

    transform:translateX(-100%);

    animation:
        loadingBar 1.7s ease forwards;
}

.loader-text{
    color:#657284;

    font-size:10px;

    letter-spacing:4px;
}

@keyframes loadingBar{

    to{
        transform:translateX(0);
    }

}

@keyframes hideLoader{

    0%{
        opacity:1;
        visibility:visible;
        pointer-events:auto;
    }

    99%{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }

    100%{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
        display:none;
    }

}


/* =========================================================
   NAVIGATION
========================================================= */

.navbar{
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:72px;

    z-index:5000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7%;

    background:rgba(5,7,12,.88);

    border-bottom:1px solid rgba(0,157,255,.12);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.brand{
    color:white;

    text-decoration:none;

    font-size:19px;

    font-weight:1000;

    letter-spacing:3px;
}

.brand span{
    color:var(--yellow);
}

.nav-links{
    display:flex;

    align-items:center;

    gap:26px;

    list-style:none;
}

.nav-links button{
    border:0;

    background:none;

    color:#8995a6;

    font-size:11px;

    font-weight:bold;

    letter-spacing:2px;

    transition:.25s;
}

.nav-links button:hover{
    color:var(--yellow);
}

.menu-button{
    display:none;

    background:none;

    border:0;

    color:var(--yellow);

    font-size:27px;
}


/* =========================================================
   GENERAL
========================================================= */

section{
    padding:110px 7%;
}

.section-header{
    max-width:850px;

    margin:0 auto 55px;

    text-align:center;
}

.section-label{
    color:var(--blue2);

    font-size:10px;

    font-weight:bold;

    letter-spacing:5px;
}

.section-header h2{
    margin-top:12px;

    font-size:clamp(34px,6vw,65px);

    line-height:1;

    font-weight:1000;
}

.section-header h2 span{
    color:var(--yellow);
}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    padding-top:120px;

    text-align:center;
}

.hero-content{
    width:100%;
    max-width:1100px;
}

.hero-label{
    margin-bottom:28px;

    color:var(--yellow);

    font-size:11px;

    font-weight:bold;

    letter-spacing:7px;
}

.hero h1{
    font-size:clamp(65px,15vw,175px);

    line-height:.8;

    letter-spacing:-7px;

    font-weight:1000;

    background:
        linear-gradient(
            110deg,
            #ffffff,
            var(--blue2),
            var(--yellow),
            #ffffff
        );

    background-size:300% 300%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        heroGradient 6s ease-in-out infinite alternate;
}

.hero h2{
    margin-top:25px;

    color:var(--yellow);

    font-size:clamp(30px,7vw,75px);

    letter-spacing:10px;

    font-weight:1000;

    text-shadow:
        0 0 35px rgba(255,208,0,.18);
}

.hero-description{
    max-width:700px;

    margin:30px auto 0;

    color:#9ca8b7;

    font-size:17px;

    line-height:1.8;
}

.hero-buttons{
    margin-top:38px;

    display:flex;

    justify-content:center;

    gap:12px;

    flex-wrap:wrap;
}

.btn{
    padding:14px 23px;

    border-radius:7px;

    border:1px solid var(--yellow);

    background:rgba(255,208,0,.04);

    color:var(--yellow);

    font-size:11px;

    font-weight:bold;

    letter-spacing:1.5px;

    transition:.25s;
}

.btn:hover{
    background:var(--yellow);

    color:#05070c;

    transform:translateY(-3px);

    box-shadow:
        0 0 30px rgba(255,208,0,.18);
}

.btn-blue{
    border-color:var(--blue);

    color:var(--blue2);
}

.btn-blue:hover{
    background:var(--blue);

    color:white;

    box-shadow:
        0 0 30px rgba(0,157,255,.18);
}

@keyframes heroGradient{

    from{
        background-position:0% 50%;
    }

    to{
        background-position:100% 50%;
    }

}


/* =========================================================
   STATS
========================================================= */

.stats-section{
    padding-top:20px;
}

.stats{
    max-width:1050px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    overflow:hidden;

    border:1px solid var(--border);

    border-radius:17px;

    background:rgba(255,255,255,.015);
}

.stat{
    padding:30px 20px;

    text-align:center;

    border-right:1px solid var(--border);
}

.stat:last-child{
    border-right:0;
}

.stat strong{
    display:block;

    color:var(--yellow);

    font-size:32px;

    font-weight:1000;
}

.stat span{
    display:block;

    margin-top:7px;

    color:#687587;

    font-size:9px;

    letter-spacing:2px;
}


/* =========================================================
   VERSE
========================================================= */

.verse-layout{
    max-width:1150px;

    margin:auto;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:55px;

    align-items:center;
}

.verse-card{
    padding:42px;

    border-radius:18px;

    border:1px solid rgba(0,157,255,.18);

    background:
        linear-gradient(
            145deg,
            rgba(0,157,255,.06),
            rgba(255,208,0,.025)
        );
}

.verse-card h3{
    margin-bottom:20px;

    color:var(--yellow);

    font-size:27px;
}

.verse-card p{
    color:#a2adbb;

    font-size:16px;

    line-height:1.9;
}

.verse-symbol{
    min-height:350px;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;
}

.symbol-ring{
    width:260px;
    height:260px;

    border:1px solid var(--blue);

    border-radius:50%;

    box-shadow:
        0 0 60px rgba(0,157,255,.12);

    animation:
        slowSpin 18s linear infinite;
}

.symbol-ring::before{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    margin:44px;

    border:2px solid var(--yellow);

    border-radius:50%;
}

.symbol-letter{
    position:absolute;

    color:white;

    font-size:65px;

    font-weight:1000;

    text-shadow:
        0 0 30px var(--blue);
}

@keyframes slowSpin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   CHARACTER DATABASE
========================================================= */

.database-tools{
    max-width:1150px;

    margin:0 auto 35px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;
}

.search{
    flex:1;

    min-width:240px;

    padding:14px 17px;

    border-radius:8px;

    border:1px solid rgba(0,157,255,.18);

    outline:none;

    background:#080d14;

    color:white;
}

.search::placeholder{
    color:#657284;
}

.search:focus{
    border-color:var(--blue);

    box-shadow:
        0 0 20px rgba(0,157,255,.08);
}

.filters{
    display:flex;

    gap:8px;

    flex-wrap:wrap;
}

.filter{
    padding:11px 15px;

    border-radius:7px;

    border:1px solid rgba(255,255,255,.09);

    background:#080d14;

    color:#778496;

    font-size:10px;

    font-weight:bold;

    letter-spacing:1px;
}

.filter:hover,
.filter.active{
    border-color:var(--yellow);

    color:var(--yellow);
}


/* =========================================================
   CHARACTER CARDS
========================================================= */

.characters{
    max-width:1150px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(245px,1fr));

    gap:20px;
}

.character{
    min-height:310px;

    padding:27px;

    position:relative;

    overflow:hidden;

    border-radius:17px;

    border:1px solid var(--border);

    background:
        linear-gradient(
            145deg,
            rgba(0,157,255,.035),
            rgba(255,208,0,.02)
        );

    transition:.3s;
}

.character::before{
    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:2px;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--yellow)
        );

    transform:scaleX(0);

    transform-origin:left;

    transition:.3s;
}

.character:hover{
    transform:translateY(-7px);

    border-color:rgba(0,157,255,.35);

    box-shadow:
        0 20px 50px rgba(0,100,255,.08);
}

.character:hover::before{
    transform:scaleX(1);
}

.character.hidden{
    display:none;
}

.character-symbol{
    width:82px;
    height:82px;

    margin-bottom:25px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:1px solid var(--yellow);

    color:var(--yellow);

    font-size:21px;

    font-weight:1000;

    background:
        radial-gradient(
            circle,
            rgba(255,208,0,.08),
            transparent 65%
        );

    box-shadow:
        0 0 30px rgba(255,208,0,.07);
}

.character h3{
    font-size:18px;

    font-weight:1000;
}

.character-role{
    margin:8px 0 13px;

    color:var(--blue2);

    font-size:9px;

    font-weight:bold;

    letter-spacing:2px;
}

.character-description{
    color:#8995a5;

    font-size:13px;

    line-height:1.65;
}

.view-profile{
    margin-top:20px;

    padding:9px 13px;

    border-radius:6px;

    border:1px solid rgba(255,255,255,.1);

    background:transparent;

    color:#9ca8b7;

    font-size:9px;

    font-weight:bold;

    letter-spacing:1px;
}

.view-profile:hover{
    color:var(--yellow);

    border-color:var(--yellow);
}


/* =========================================================
   PROJECTS
========================================================= */

.project-grid{
    max-width:1150px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));

    gap:20px;
}

.project{
    position:relative;

    min-height:260px;

    padding:32px;

    overflow:hidden;

    border-radius:17px;

    border:1px solid var(--border);

    background:#080d14;

    transition:.3s;
}

.project:hover{
    transform:translateY(-6px);

    border-color:rgba(255,208,0,.35);
}

.project-number{
    position:absolute;

    top:8px;
    right:20px;

    color:rgba(255,255,255,.035);

    font-size:75px;

    font-weight:1000;
}

.project h3{
    color:var(--yellow);

    font-size:26px;

    margin-bottom:16px;
}

.project p{
    color:#8d99a9;

    line-height:1.75;

    font-size:14px;
}


/* =========================================================
   LORE
========================================================= */

.lore{
    max-width:950px;

    margin:auto;
}

.lore-entry{
    display:grid;

    grid-template-columns:110px 1fr;

    gap:20px;

    margin-bottom:24px;
}

.lore-label{
    padding-top:20px;

    color:var(--yellow);

    font-size:9px;

    font-weight:bold;

    letter-spacing:2px;
}

.lore-content{
    padding:22px 25px;

    border-left:2px solid var(--blue);

    border-radius:
        0 12px 12px 0;

    background:
        rgba(0,157,255,.025);
}

.lore-content h3{
    margin-bottom:9px;
}

.lore-content p{
    color:#8995a5;

    font-size:14px;

    line-height:1.7;
}


/* =========================================================
   ARCHIVES
========================================================= */

.archive-grid{
    max-width:1150px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(250px,1fr));

    gap:20px;
}

.archive{
    padding:30px;

    border-radius:16px;

    border:1px solid rgba(0,157,255,.12);

    background:#080d14;

    transition:.3s;
}

.archive:hover{
    transform:translateY(-5px);

    border-color:var(--blue);
}

.archive-icon{
    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin-bottom:18px;

    border-radius:11px;

    border:1px solid rgba(255,208,0,.2);

    color:var(--yellow);

    font-size:20px;
}

.archive h3{
    margin-bottom:10px;

    font-size:17px;
}

.archive p{
    color:#8793a3;

    font-size:13px;

    line-height:1.7;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:15000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.88);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;

    max-width:700px;

    max-height:90vh;

    overflow:auto;

    position:relative;

    padding:38px;

    border-radius:20px;

    border:1px solid var(--blue);

    background:#070c14;

    box-shadow:
        0 0 80px rgba(0,157,255,.12);

    animation:
        modalAppear .25s ease;
}

.modal-close{
    position:absolute;

    top:14px;
    right:14px;

    width:40px;
    height:40px;

    border-radius:50%;

    border:1px solid rgba(255,208,0,.2);

    background:rgba(255,208,0,.04);

    color:var(--yellow);

    font-size:25px;
}

.modal-close:hover{
    background:rgba(255,208,0,.13);
}

.modal-symbol{
    width:105px;
    height:105px;

    margin-bottom:25px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:2px solid var(--yellow);

    color:var(--yellow);

    font-size:28px;

    font-weight:1000;

    box-shadow:
        0 0 40px rgba(255,208,0,.08);
}

.modal-box h2{
    padding-right:45px;

    color:var(--yellow);

    font-size:30px;
}

.modal-role{
    margin:8px 0 20px;

    color:var(--blue2);

    font-size:10px;

    font-weight:bold;

    letter-spacing:3px;
}

.modal-description{
    color:#a7b1be;

    font-size:16px;

    line-height:1.9;
}

@keyframes modalAppear{

    from{
        opacity:0;
        transform:scale(.95);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}


/* =========================================================
   SECRET MESSAGE
========================================================= */

.secret{
    position:fixed;

    inset:0;

    z-index:20000;

    display:none;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;

    background:rgba(0,0,0,.95);
}

.secret.active{
    display:flex;
}

.secret-content{
    max-width:800px;

    animation:
        secretAppear .5s ease;
}

.secret h2{
    color:var(--yellow);

    font-size:clamp(50px,11vw,110px);

    font-weight:1000;

    text-shadow:
        0 0 40px rgba(255,208,0,.2);
}

.secret-roar{
    margin-top:20px;

    color:white;

    font-size:clamp(20px,4vw,34px);

    font-weight:bold;

    line-height:1.8;
}

.secret-sub{
    margin-top:10px;

    color:#667384;

    font-size:10px;

    letter-spacing:4px;
}

.secret-close{
    margin-top:30px;
}

@keyframes secretAppear{

    from{
        opacity:0;
        transform:scale(.9);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}


/* =========================================================
   SECRET BUTTON
========================================================= */

.secret-button{
    position:fixed;

    right:18px;
    bottom:18px;

    z-index:4000;

    width:44px;
    height:44px;

    border-radius:50%;

    border:1px solid rgba(0,157,255,.25);

    background:rgba(0,157,255,.06);

    color:var(--blue);

    opacity:.45;

    transition:.25s;
}

.secret-button:hover{
    opacity:1;

    box-shadow:
        0 0 25px rgba(0,157,255,.2);
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    padding:75px 7% 30px;

    text-align:center;

    border-top:1px solid rgba(255,255,255,.07);
}

.footer-logo{
    font-size:30px;

    font-weight:1000;

    letter-spacing:3px;
}

.footer-logo span{
    color:var(--yellow);
}

.footer-description{
    margin-top:10px;

    color:#697586;

    font-size:13px;
}

.footer-credit{
    margin-top:30px;

    padding-top:25px;

    border-top:1px solid rgba(255,255,255,.06);

    color:#8995a5;

    font-size:13px;
}

.footer-credit strong{
    color:var(--yellow);
}

.copyright{
    margin-top:12px;

    color:#566171;

    font-size:10px;

    letter-spacing:2px;
}

.version{
    margin-top:18px;

    color:var(--blue2);

    font-size:9px;

    letter-spacing:3px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    .navbar{
        padding:0 5%;
    }

    .menu-button{
