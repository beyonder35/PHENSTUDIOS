<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="PEHEN STUDIOS — Official home of the PEHEN VERSE.">
<meta name="author" content="Pehen Studios">
<meta name="copyright" content="© 2026 Pehen Studios. All Rights Reserved.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#03050a">

<title>PEHEN STUDIOS | PEHEN VERSE</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');

:root{
    --yellow:#ffd000;
    --yellow2:#ffea70;
    --blue:#009dff;
    --blue2:#55c5ff;
    --black:#03050a;
    --dark:#070b12;
    --card:#0a1019;
    --muted:#8793a3;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--black);
    color:white;
    font-family:'Rajdhani',Arial,sans-serif;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    border:0;
}

::selection{
    background:var(--yellow);
    color:#05070b;
}


/* =====================================================
   LOADER
===================================================== */

#loader{
    position:fixed;
    inset:0;
    background:#020407;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:99999;

    opacity:1;
    visibility:visible;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

#loader.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loader-content{
    text-align:center;
}

.loader-logo{
    font-family:'Orbitron',sans-serif;
    font-size:clamp(35px,8vw,80px);
    font-weight:900;
    letter-spacing:5px;

    text-shadow:
        0 0 30px rgba(0,157,255,.5);
}

.loader-logo span{
    color:var(--yellow);
}

.loader-line{
    width:220px;
    height:2px;

    background:rgba(255,255,255,.08);

    margin:25px auto;

    overflow:hidden;
}

.loader-progress{
    height:100%;
    width:100%;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--yellow)
        );

    animation:loading 1.2s ease;
}

.loader-text{
    color:#657184;

    font-family:'Orbitron',sans-serif;

    font-size:10px;

    letter-spacing:4px;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:-4;

    background:
        radial-gradient(
            circle at 10% 15%,
            rgba(0,157,255,.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 70%,
            rgba(255,208,0,.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(0,80,255,.1),
            transparent 35%
        );
}

.grid{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:-3;

    background-image:
        linear-gradient(
            rgba(0,157,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,157,255,.035) 1px,
            transparent 1px
        );

    background-size:55px 55px;
}


/* =====================================================
   NAVBAR
===================================================== */

nav{
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:75px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7%;

    background:rgba(3,5,10,.75);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-bottom:
        1px solid rgba(0,157,255,.16);

    z-index:5000;
}

.logo{
    font-family:'Orbitron',sans-serif;

    font-weight:900;

    font-size:21px;

    letter-spacing:3px;
}

.logo span{
    color:var(--yellow);
}

.nav-links{
    display:flex;

    gap:25px;

    list-style:none;
}

.nav-links button{
    background:transparent;

    color:#9aa5b5;

    cursor:pointer;

    font-size:14px;

    font-weight:700;

    letter-spacing:1.5px;

    transition:.3s;
}

.nav-links button:hover{
    color:var(--yellow);

    text-shadow:
        0 0 15px rgba(255,208,0,.5);
}

.menu{
    display:none;

    background:transparent;

    color:var(--yellow);

    font-size:28px;

    cursor:pointer;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
        120px 20px 80px;
}

.hero-content{
    max-width:1050px;
}

.hero-tag{
    color:var(--yellow);

    font-family:'Orbitron',sans-serif;

    font-size:12px;

    letter-spacing:7px;

    margin-bottom:25px;

    animation:
        fadeUp 1s ease both;
}

.hero h1{
    font-family:'Orbitron',sans-serif;

    font-size:
        clamp(55px,12vw,155px);

    line-height:.85;

    font-weight:900;

    letter-spacing:-5px;

    background:
        linear-gradient(
            110deg,
            white 5%,
            var(--blue2) 40%,
            var(--yellow) 70%,
            white
        );

    background-size:300%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        gradientMove 5s infinite alternate,
        fadeUp 1s ease both;
}

.hero h2{
    font-family:'Orbitron',sans-serif;

    color:var(--yellow);

    font-size:
        clamp(25px,5vw,65px);

    letter-spacing:8px;

    margin-top:25px;

    text-shadow:
        0 0 30px rgba(255,208,0,.25);

    animation:
        fadeUp 1s .15s ease both;
}

.hero p{
    max-width:680px;

    margin:30px auto;

    color:#9da9b8;

    font-size:19px;

    line-height:1.65;

    animation:
        fadeUp 1s .3s ease both;
}

.hero-buttons{
    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:14px;

    margin-top:35px;

    animation:
        fadeUp 1s .45s ease both;
}

.btn{
    padding:14px 26px;

    border-radius:6px;

    border:
        1px solid var(--yellow);

    background:
        rgba(255,208,0,.04);

    color:var(--yellow);

    font-weight:800;

    letter-spacing:1.5px;

    cursor:pointer;

    transition:.3s;
}

.btn:hover{
    background:var(--yellow);

    color:#05070b;

    box-shadow:
        0 0 35px rgba(255,208,0,.3);

    transform:translateY(-3px);
}

.btn.blue{
    border-color:var(--blue);

    color:var(--blue2);
}

.btn.blue:hover{
    background:var(--blue);

    color:white;

    box-shadow:
        0 0 35px rgba(0,157,255,.3);
}


/* =====================================================
   SECTIONS
===================================================== */

section{
    padding:110px 7%;

    position:relative;
}

.section-title{
    text-align:center;

    margin-bottom:55px;
}

.section-tag{
    font-family:'Orbitron',sans-serif;

    color:var(--blue2);

    font-size:11px;

    letter-spacing:4px;
}

.section-title h2{
    font-family:'Orbitron',sans-serif;

    font-size:
        clamp(30px,5vw,58px);

    margin-top:10px;
}

.section-title h2 span{
    color:var(--yellow);
}


/* =====================================================
   STATS
===================================================== */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    max-width:1000px;

    margin:
        0 auto 100px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:15px;

    overflow:hidden;

    background:
        rgba(255,255,255,.015);
}

.stat{
    padding:28px;

    text-align:center;

    border-right:
        1px solid rgba(255,255,255,.07);
}

.stat:last-child{
    border-right:0;
}

.stat strong{
    display:block;

    font-family:'Orbitron',sans-serif;

    font-size:30px;

    color:var(--yellow);
}

.stat span{
    color:#707c8c;

    font-size:12px;

    letter-spacing:2px;
}


/* =====================================================
   VERSE
===================================================== */

.verse{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:60px;

    align-items:center;
}

.verse-box{
    padding:45px;

    border-radius:20px;

    border:
        1px solid rgba(0,157,255,.2);

    background:
        linear-gradient(
            145deg,
            rgba(0,157,255,.07),
            rgba(255,208,0,.025)
        );

    box-shadow:
        0 0 70px rgba(0,100,255,.05);
}

.verse-box h3{
    color:var(--yellow);

    font-family:'Orbitron',sans-serif;

    font-size:27px;

    margin-bottom:20px;
}

.verse-box p{
    color:#aab5c3;

    line-height:1.85;

    font-size:17px;
}

.verse-symbol{
    height:370px;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;
}

.ring{
    width:280px;
    height:280px;

    border:
        1px solid var(--blue);

    border-radius:50%;

    box-shadow:
        0 0 50px rgba(0,157,255,.16),
        inset 0 0 40px rgba(0,157,255,.08);

    animation:
        spin 20s linear infinite;
}

.ring::before{
    content:"";

    position:absolute;

    width:185px;
    height:185px;

    margin:47px;

    border:
        2px solid var(--yellow);

    border-radius:50%;
}

.ring-text{
    position:absolute;

    font-family:'Orbitron',sans-serif;

    font-size:40px;

    font-weight:900;

    text-shadow:
        0 0 25px var(--blue);
}


/* =====================================================
   CHARACTER DATABASE
===================================================== */

.database-tools{
    max-width:1000px;

    margin:
        0 auto 35px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;
}

.search-box{
    flex:1;

    min-width:230px;
}

.search-box input{
    width:100%;

    padding:15px 18px;

    border-radius:8px;

    border:
        1px solid rgba(0,157,255,.2);

    background:
        rgba(255,255,255,.035);

    color:white;

    outline:none;

    font-size:16px;
}

.search-box input:focus{
    border-color:var(--blue);

    box-shadow:
        0 0 20px rgba(0,157,255,.1);
}

.filters{
    display:flex;

    gap:8px;

    flex-wrap:wrap;
}

.filter{
    padding:11px 16px;

    border-radius:7px;

    border:
        1px solid rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.025);

    color:#8d99a9;

    cursor:pointer;

    font-weight:700;

    transition:.3s;
}

.filter:hover,
.filter.active{
    border-color:var(--yellow);

    color:var(--yellow);

    background:
        rgba(255,208,0,.06);
}


/* =====================================================
   CHARACTERS
===================================================== */

.characters{
    max-width:1200px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(245px,1fr));

    gap:22px;
}

.character{
    min-height:335px;

    border-radius:16px;

    overflow:hidden;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        linear-gradient(
            150deg,
            #080d15,
            #05070c
        );

    cursor:pointer;

    transition:.35s;

    position:relative;
}

.character:hover{
    transform:translateY(-9px);

    border-color:var(--blue);

    box-shadow:
        0 20px 60px rgba(0,120,255,.13);
}

.character.hidden{
    display:none;
}

.character-image{
    height:195px;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(0,157,255,.3),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #071426,
            #0d121a
        );
}

.character-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:.4s;
}

.character:hover .character-image img{
    transform:scale(1.06);
}

.placeholder-avatar{
    width:105px;
    height:105px;

    border-radius:50%;

    border:
        2px solid var(--yellow);

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--yellow);

    font-family:'Orbitron',sans-serif;

    font-size:27px;

    font-weight:900;

    box-shadow:
        0 0 40px rgba(255,208,0,.2);
}

.character-info{
    padding:20px;
}

.character-info h3{
    font-family:'Orbitron',sans-serif;

    font-size:17px;
}

.character-role{
    color:var(--blue2);

    font-size:12px;

    letter-spacing:2px;

    margin:7px 0;
}

.character-info p{
    color:#8793a3;

    line-height:1.5;

    font-size:15px;
}


/* =====================================================
   PROJECTS
===================================================== */

.projects{
    max-width:1150px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(290px,1fr));

    gap:25px;
}

.project{
    min-height:285px;

    padding:35px;

    border-radius:18px;

    border:
        1px solid rgba(255,208,0,.14);

    background:
        linear-gradient(
            140deg,
            rgba(255,208,0,.06),
            rgba(0,157,255,.04)
        );

    position:relative;

    overflow:hidden;

    transition:.35s;
}

.project:hover{
    transform:translateY(-7px);

    border-color:var(--yellow);

    box-shadow:
        0 20px 50px rgba(255,208,0,.08);
}

.project-number{
    position:absolute;

    right:20px;
    top:10px;

    font-family:'Orbitron',sans-serif;

    font-size:70px;

    font-weight:900;

    color:rgba(255,255,255,.035);
}

.project h3{
    font-family:'Orbitron',sans-serif;

    color:var(--yellow);

    font-size:27px;

    margin-bottom:18px;
}

.project p{
    color:#9ca8b6;

    line-height:1.75;
}


/* =====================================================
   LORE
===================================================== */

.lore-list{
    max-width:950px;

    margin:auto;
}

.lore-item{
    display:grid;

    grid-template-columns:110px 1fr;

    gap:25px;

    margin-bottom:25px;
}

.lore-date{
    color:var(--yellow);

    font-family:'Orbitron',sans-serif;

    font-size:12px;

    padding-top:20px;
}

.lore-content{
    padding:20px 25px;

    border-left:
        2px solid var(--blue);

    border-radius:
        0 12px 12px 0;

    background:
        rgba(0,157,255,.035);
}

.lore-content h3{
    font-family:'Orbitron',sans-serif;

    margin-bottom:9px;
}

.lore-content p{
    color:#8995a5;

    line-height:1.65;
}


/* =====================================================
   ARCHIVES
===================================================== */

.archive-grid{
    max-width:1150px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));

    gap:22px;
}

.archive-card{
    padding:30px;

    border-radius:16px;

    border:
        1px solid rgba(0,157,255,.15);

    background:
        rgba(0,157,255,.025);

    transition:.3s;
}

.archive-card:hover{
    border-color:var(--blue);

    transform:translateY(-6px);

    box-shadow:
        0 20px 45px rgba(0,157,255,.08);
}

.archive-icon{
    width:50px;
    height:50px;

    border-radius:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(255,208,0,.08);

    border:
        1px solid rgba(255,208,0,.2);

    color:var(--yellow);

    font-size:22px;

    margin-bottom:20px;
}

.archive-card h3{
    font-family:'Orbitron',sans-serif;

    margin-bottom:10px;
}

.archive-card p{
    color:#8995a5;

    line-height:1.65;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.84);

    backdrop-filter:blur(15px);

    -webkit-backdrop-filter:blur(15px);

    z-index:10000;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;

    max-width:720px;

    max-height:
        calc(100vh - 40px);

    overflow:auto;

    padding:40px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #09101a,
            #05070c
        );

    border:
        1px solid var(--blue);

    box-shadow:
        0 0 90px rgba(0,157,255,.16);

    position:relative;

    animation:
        modalIn .25s ease both;
}

.modal-image{
    height:220px;

    border-radius:14px;

    margin-bottom:25px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            rgba(0,157,255,.3),
            transparent 45%
        ),
        #070c14;

    border:
        1px solid rgba(255,255,255,.07);
}

.modal-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:14px;
}

.modal-box h2{
    font-family:'Orbitron',sans-serif;

    color:var(--yellow);

    font-size:28px;

    padding-right:40px;
}

.modal-role{
    color:var(--blue2);

    letter-spacing:3px;

    font-size:12px;

    margin:8px 0 20px;
}

.modal-box p{
    color:#aab5c3;

    line-height:1.8;

    font-size:17px;
}

.modal-close{
    position:absolute;

    right:18px;
    top:18px;

    width:40px;
    height:40px;

    border-radius:50%;

    background:
        rgba(255,208,0,.05);

    color:var(--yellow);

    font-size:27px;

    cursor:pointer;

    z-index:2;
}

.modal-close:hover{
    background:
        rgba(255,208,0,.15);
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    padding:
        75px 7% 30px;

    text-align:center;

    border-top:
        1px solid rgba(255,255,255,.07);

    background:
        linear-gradient(
            to bottom,
            rgba(0,157,255,.02),
            rgba(255,208,0,.025)
        );
}

.footer-logo{
    font-family:'Orbitron',sans-serif;

    font-size:32px;

    font-weight:900;

    letter-spacing:3px;
}

.footer-logo span{
    color:var(--yellow);
}

.footer-description{
    color:#687486;

    margin-top:12px;

    font-size:15px;
}

.footer-credit{
    margin-top:28px;

    padding-top:25px;

    border-top:
        1px solid rgba(255,255,255,.06);

    color:#8a95a5;

    font-size:13px;

    letter-spacing:1px;
}

.footer-credit strong{
    color:var(--yellow);
}

.copyright{
    margin-top:10px;

    color:#566171;

    font-size:11px;

    letter-spacing:2px;
}

.footer-version{
    margin-top:18px;

    color:var(--blue2);

    font-size:10px;

    letter-spacing:4px;
}


/* =====================================================
   SECRET
===================================================== */

.easter{
    position:fixed;

    right:20px;
    bottom:20px;

    width:45px;
    height:45px;

    border-radius:50%;

    background:
        rgba(0,157,255,.08);

    border:
        1px solid rgba(0,157,255,.25);

    color:var(--blue);

    cursor:pointer;

    opacity:.45;

    transition:.3s;

    z-index:3000;
}

.easter:hover{
    opacity:1;

    box-shadow:
        0 0 25px rgba(0,157,255,.3);
}

.secret-message{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.92);

    z-index:20000;

    text-align:center;

    padding:30px;
}

.secret-message.active{
    display:flex;
}

.secret-message h2{
    font-family:'Orbitron',sans-serif;

    font-size:
        clamp(35px,8vw,80px);

    color:var(--yellow);

    text-shadow:
        0 0 30px rgba(255,208,0,.4);
}

.secret-message p{
    color:#8793a3;
